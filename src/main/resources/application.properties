spring.application.name=gestion-motocicletas

server.port=8080
server.servlet.context-path=/gestion_motocicletas

# Ruta base del servlet de Spring Web Services (SOAP)
spring.webservices.path=/ws

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/gestion_motocicletas
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
