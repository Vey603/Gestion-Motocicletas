spring.application.name=gestion-motocicletas

server.port=8080
server.servlet.context-path=/gestion_motocicletas

# Ruta base del servlet de Spring Web Services (SOAP)
spring.webservices.path=/ws

# Perfil activo por defecto: h2 (base de datos en memoria precargada con las 5 motocicletas)
# Para usar PostgreSQL en el puerto 5434, ejecute con: SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}
spring.jpa.open-in-view=false
